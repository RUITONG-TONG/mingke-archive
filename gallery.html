<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>珍藏的图片 · 【铭刻】的存录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 20px 20px;
        }

        header h1 {
            font-size: 2em;
            color: #00d4ff;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
            margin-bottom: 10px;
        }

        header p {
            color: #00d4ff;
            font-size: 0.95em;
            letter-spacing: 2px;
        }

        .back-home {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 20px;
            border: 1px solid rgba(0, 212, 255, 0.5);
            border-radius: 20px;
            color: #00d4ff;
            text-decoration: none;
            font-size: 0.9em;
            transition: all 0.3s;
        }
        .back-home:hover { background: #00d4ff; color: #1a1a2e; }

        /* ============ 布局：左列表 + 右图片 ============ */
        .container {
            max-width: 1100px;
            margin: 30px auto;
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        /* 左侧分类列表 */
        .category-list {
            flex: 0 0 180px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: sticky;
            top: 20px;
        }

        .category-list h2 {
            color: #00d4ff;
            font-size: 1.1em;
            letter-spacing: 2px;
            margin-bottom: 5px;
            padding-left: 8px;
            border-left: 3px solid #00d4ff;
        }

        .category-btn {
            text-align: left;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 10px;
            color: #c8d0e7;
            font-size: 0.95em;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .category-btn:hover {
            border-color: #00d4ff;
            color: #00d4ff;
            transform: translateX(4px);
        }

        .category-btn.active {
            background: #00d4ff;
            color: #1a1a2e;
            font-weight: bold;
            border-color: #00d4ff;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.4);
        }

        /* 右侧图片区 */
        .gallery-area {
            flex: 1;
            min-width: 0;
        }

        .gallery-title {
            color: #00d4ff;
            font-size: 1.5em;
            letter-spacing: 3px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(0, 212, 255, 0.3);
        }

        /* 图片网格 */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }

        /* 单张图片 */
        .gallery-grid img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid rgba(0, 212, 255, 0.25);
            cursor: pointer;
            transition: all 0.3s;
            display: block;
            background: rgba(0, 0, 0, 0.3);
        }

        .gallery-grid img:hover {
            transform: scale(1.04);
            border-color: #00d4ff;
            box-shadow: 0 8px 25px rgba(0, 212, 255, 0.4);
        }

        /* 手机适配：左右改成上下 */
        @media (max-width: 700px) {
            .container {
                flex-direction: column;
            }

            .category-list {
                flex: none;
                width: 100%;
                position: static;
                flex-direction: row;
                flex-wrap: wrap;
            }

            .category-list h2 {
                width: 100%;
            }

            .category-btn {
                flex: 1 1 auto;
                text-align: center;
            }

            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 10px;
            }

            .gallery-grid img {
                height: 130px;
            }
        }

        /* ============ 大图预览 ============ */
        .lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
            cursor: zoom-out;
        }

        .lightbox.show {
            display: flex;
        }

        .lightbox img {
            max-width: 95%;
            max-height: 90vh;
            border-radius: 12px;
            border: 2px solid rgba(0, 212, 255, 0.6);
            box-shadow: 0 0 60px rgba(0, 212, 255, 0.4);
            object-fit: contain;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            background: none;
            border: none;
            color: #00d4ff;
            font-size: 2.5em;
            cursor: pointer;
            line-height: 1;
        }
        .lightbox-close:hover { color: #fff; }

        footer {
            text-align: center;
            padding: 30px;
            color: #6b7280;
            font-size: 0.85em;
        }
    </style>
</head>
<body>

    <header>
        <h1>珍藏的图片</h1>
        <p>—— 一些风景，一些人，一些事 ——</p>
        <a href="index.html" class="back-home">← 返回首页</a>
    </header>

    <div class="container">

        <!-- 左侧分类列表 -->
        <aside class="category-list">
            <h2>分类</h2>
            <button class="category-btn active" data-cat="cat1"><div style="color: #dc143c;">［未解识］</div>场景图</button>
            <button class="category-btn" data-cat="cat2"><div style="color: #dc143c;">［未解识］</div>过场CG</button>
            <button class="category-btn" data-cat="cat3"><div style="color: #dc143c;">［未解识］</div>概念海报</button>
            <button class="category-btn" data-cat="cat4"><div style="color: #dc143c;">［未解识］</div>角色立绘</button>
            <button class="category-btn" data-cat="cat5"><div style="color: #dc143c;">［未解识］</div>杂图</button>
        </aside>

        <!-- 右侧图片区 -->
        <main class="gallery-area">

            <!-- 分类一 -->
            <section class="gallery-content" id="cat1">
                <h2 class="gallery-title">场景图</h2>
                <div class="gallery-grid">
                    <img src="images/图1.png" alt="">
                    <img src="images/图2.png" alt="">
                    <img src="images/图3.png" alt="">
                    <img src="images/图4.png" alt="">
                </div>
            </section>

            <!-- 分类二 -->
            <section class="gallery-content" id="cat2" style="display:none;">
                <h2 class="gallery-title">过场CG</h2>
                <div class="gallery-grid">
                    <img src="images/立绘1.png" alt="">
                    <img src="images/立绘2.png" alt="">
                    <img src="images/立绘3.png" alt="">
                </div>
            </section>

            <!-- 分类三 -->
            <section class="gallery-content" id="cat3" style="display:none;">
                <h2 class="gallery-title">概念海报</h2>
                <div class="gallery-grid">
                    <img src="images/场景1.png" alt="">
                    <img src="images/场景2.png" alt="">
                </div>
            </section>

            <!-- 分类四 -->
            <section class="gallery-content" id="cat4" style="display:none;">
                <h2 class="gallery-title">角色立绘</h2>
                <div class="gallery-grid">
                    <img src="images/徽记1.png" alt="">
                    <img src="images/徽记2.png" alt="">
                </div>
            </section>

            <!-- 分类五 -->
            <section class="gallery-content" id="cat5" style="display:none;">
                <h2 class="gallery-title">杂图</h2>
                <div class="gallery-grid">
                    <img src="images/杂图1.png" alt="">
                </div>
            </section>

        </main>
    </div>

    <!-- 大图预览 -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightboxClose">×</button>
        <img id="lightboxImg" src="" alt="">
    </div>

    <footer>
        © 2026 【铭刻】的概念 · 保留所有权利
    </footer>
    
    <footer>
      某些你可能经历过的事情，即使过去了，也永远存在。
      </footer>

    <script>
        // ====== 1. 分类切换 ======
        const buttons = document.querySelectorAll('.category-btn');
        const contents = document.querySelectorAll('.gallery-content');

        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                buttons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const target = btn.dataset.cat;
                contents.forEach(c => {
                    c.style.display = (c.id === target) ? 'block' : 'none';
                });

                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        });

        // ====== 2. 点图放大 ======
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');

        document.querySelectorAll('.gallery-grid img').forEach(img => {
            img.addEventListener('click', () => {
                lightboxImg.src = img.src;
                lightbox.classList.add('show');
            });
        });

        document.getElementById('lightboxClose').addEventListener('click', () => {
            lightbox.classList.remove('show');
        });

        // 点背景关闭
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) lightbox.classList.remove('show');
        });
    </script>

</body>
</html>
