<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地图 · 【铭刻】的存录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }

        header { text-align: center; padding: 30px 20px 20px; }
        header h1 { font-size: 2em; color: #00d4ff; letter-spacing: 4px; text-shadow: 0 0 20px rgba(0, 212, 255, 0.5); margin-bottom: 10px; }
        header p { color: #00d4ff; font-size: 0.95em; letter-spacing: 2px; }
        .back-home { display: inline-block; margin-top: 15px; padding: 8px 20px; border: 1px solid rgba(0, 212, 255, 0.5); border-radius: 20px; color: #00d4ff; text-decoration: none; font-size: 0.9em; transition: all 0.3s; }
        .back-home:hover { background: #00d4ff; color: #1a1a2e; }

        /* ============ 地图容器（关键修复） ============ */
        .map-wrapper {
            position: relative; /* 必须 */
            max-width: 900px;
            margin: 30px auto;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(0, 212, 255, 0.4);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            /* 用 aspect-ratio 锁死比例，图片没加载也不会塌陷 */
            aspect-ratio: 1 / 1; 
        }

        .map-wrapper img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover; /* 保证图片和容器完全贴合 */
        }

        /* 热区：绝对定位 */
        .hotspot {
            position: absolute;
            cursor: pointer;
            border: 2px dashed rgba(0, 212, 255, 0); /* 默认透明 */
            border-radius: 8px;
            transition: all 0.3s;
            background: rgba(0, 212, 255, 0);
            z-index: 10;
        }

        .hotspot:hover {
            background: rgba(0, 212, 255, 0.3);
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.6);
        }

        .hotspot span {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-weight: bold;
            font-size: 0.9em;
            text-shadow: 0 0 5px #000, 0 0 5px #000, 0 0 5px #000;
            pointer-events: none;
            white-space: nowrap;
        }

        /* ============ 弹窗 ============ */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
        .modal-overlay.show { display: flex; }
        .modal-box { background: linear-gradient(135deg, #16213e, #1a1a2e); border: 1px solid rgba(0, 212, 255, 0.5); border-radius: 16px; max-width: 500px; width: 100%; max-height: 80vh; overflow-y: auto; padding: 30px; position: relative; box-shadow: 0 20px 60px rgba(0, 212, 255, 0.3); }
        .modal-box h2 { color: #00d4ff; font-size: 1.5em; margin-bottom: 15px; letter-spacing: 2px; border-bottom: 2px solid rgba(0, 212, 255, 0.3); padding-bottom: 10px; }
        .modal-box p { color: #c8d0e7; line-height: 1.9; margin-bottom: 10px; font-size: 0.95em; }
        .modal-close { position: absolute; top: 15px; right: 20px; background: none; border: none; color: #00d4ff; font-size: 1.8em; cursor: pointer; line-height: 1; }
        .modal-close:hover { color: #fff; }

        .divider-gradient { height: 1px; background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.8), transparent); margin: 20px auto; width: 100%; }

        .map-intro { max-width: 900px; margin: 25px auto; background: rgba(255, 255, 255, 0.05); border-left: 4px solid #00d4ff; border-radius: 12px; padding: 22px 25px; line-height: 1.9; backdrop-filter: blur(10px); }
        .map-intro h2 { color: #00d4ff; font-size: 1.3em; letter-spacing: 2px; margin-bottom: 12px; }
        .map-intro p { color: #c8d0e7; font-size: 0.92em; margin-bottom: 10px; }
        .map-intro p:last-child { margin-bottom: 0; }

        @media (max-width: 700px) {
            .hotspot span { font-size: 0.7em; }
        }

        footer { text-align: center; padding: 30px; color: #6b7280; font-size: 0.85em; }
    </style>
</head>
<body>

    <header>
        <h1>环流</h1>
        <p>—— 国家与地貌 ——</p>
        <a href="index.html" class="back-home">← 返回首页</a>
    </header>

    <!-- 地图容器：只有一个，千万别把 div 写到外面去了 -->
    <div class="map-wrapper" id="mapWrapper">
        <img src="images/map.png" alt="世界地图">

        <!-- 1. 瓦莱利亚 -->
        <div class="hotspot" data-target="country1" style="top: 5%; left: 61%; width: 10%; height: 20%;">
            <span>瓦莱利亚</span>
        </div>

        <!-- 2. 鸿熙 -->
        <div class="hotspot" data-target="country2" style="top: 30%; left: 37%; width: 20%; height: 20%;">
            <span>鸿熙</span>
        </div>

        <!-- 3. 和辉 -->
        <div class="hotspot" data-target="country3" style="top: 50%; left: 33%; width: 15%; height: 25%;">
            <span>和辉</span>
        </div>
        
        <!-- 4. 奥斯特罗利维斯 -->
        <div class="hotspot" data-target="country4" style="top: 30%; left: 60%; width: 25%; height: 25%;">
            <span>奥斯特罗利维斯</span>
        </div>
        
        <!-- 5. 卡隆奎蒂 -->
        <div class="hotspot" data-target="country5" style="top: 5%; left: 43%; width: 20%; height: 20%;">
            <span>卡隆奎蒂</span>
        </div>
        
        <!-- 6. 阿奎拉 -->
        <div class="hotspot" data-target="country6" style="top: 15%; left: 27%; width: 15%; height: 13%;">
            <span>阿奎拉</span>
        </div>
        
        <!-- 7. 帕尔玛（注意：必须放在 map-wrapper 里面！） -->
        <div class="hotspot" data-target="country7" style="top: 73%; left: 25%; width: 10%; height: 13%;">
            <span>帕尔玛</span>
        </div>
    </div>
    
    <div class="map-intro">
        <h2>地图总览</h2>
        <p>
            环流是平面意义上的立体存在的世界。外层是由不知名物质构建的——足以庇佑人类的——却永远无法突破的天空；内层是深不见底的海洋、不知尽头的陆地与永无止境的危害。
        </p>
        <p>
            点击地图上区域，可以查看该国的详细介绍与地貌特征。
        </p>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal-box">
            <button class="modal-close" id="modalClose">×</button>
            <h2 id="modalTitle">标题</h2>
            <div id="modalBody">内容</div>
        </div>
    </div>

    <footer>
        © 2026 【铭刻】的概念 · 保留所有权利<br><br>
        环流，无论何时都是美丽的。<br>
        而我对美丽的事物向来有耐心。
    </footer>

    <script>
        const countryData = {
            country1: { title: "瓦莱利亚", body: `<p>地区：弗兰斯、斯诺瓦、布雷肯、墨瑞恩、温特海姆</p><div class="divider-gradient"></div><p>特点：地区夏季平均气温不超过17摄氏度...</p>` },
            country2: { title: "鸿熙", body: `<p>鸿熙的介绍...</p>` },
            country3: { title: "和辉", body: `<p>和辉的介绍...</p>` },
            country4: { title: "奥斯特罗利维斯", body: `<p>奥斯特罗利维斯的介绍...</p>` },
            country5: { title: "卡隆奎蒂", body: `<p>卡隆奎蒂的介绍...</p>` },
            country6: { title: "阿奎拉", body: `<p>阿奎拉的介绍...</p>` },
            country7: { title: "帕尔玛", body: `<p>帕尔玛的介绍...</p>` }
        };

        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');

        document.querySelectorAll('.hotspot').forEach(spot => {
            spot.addEventListener('click', () => {
                const data = countryData[spot.dataset.target];
                if (data) {
                    modalTitle.textContent = data.title;
                    modalBody.innerHTML = data.body;
                    modal.classList.add('show');
                }
            });
        });

        document.getElementById('modalClose').addEventListener('click', () => {
            modal.classList.remove('show');
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.classList.remove('show');
        });
    </script>

</body>
</html>
