<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【铭刻】的存录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }

        /* 顶部标题区 */
        header {
            text-align: center;
            padding: 40px 20px 20px;
        }

        header h1 {
            font-size: 2.2em;
            color: #00d4ff;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.6);
            margin-bottom: 10px;
        }

        header p {
            color: #00d4ff;
            font-size: 0.95em;
            letter-spacing: 2px;
        }

        /* 主图 */
        .hero-image {
            max-width: 700px;
            margin: 30px auto;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(233, 69, 96, 0.4);
        }

        .hero-image img {
            width: 100%;
            display: block;
        }

        /* 文字介绍卡片 */
        .intro {
            max-width: 700px;
            margin: 30px auto;
            background: rgba(255, 255, 255, 0.05);
            border-left: 4px solid #e94560;
            border-radius: 12px;
            padding: 25px;
            line-height: 1.9;
            backdrop-filter: blur(10px);
        }

        .intro h2 {
            color: #00d4ff;
            margin-bottom: 15px;
            font-size: 1.4em;
        }

        .intro p {
            color: #00d4ff;
            margin-bottom: 12px;
        }

/* 随机小提示卡片 */
.tip-card {
    max-width: 700px;
    margin: 30px auto;
    background: rgba(255, 255, 255, 0.05);
    border-left: 4px solid #00d4ff;
    border-radius: 12px;
    padding: 25px;
    line-height: 1.9;
    backdrop-filter: blur(10px);
    min-height: 90px;
    display: flex;
    align-items: center;
    gap: 15px;
}

.tip-card .tip-label {
    flex: 0 0 auto;
    color: #00d4ff;
    font-size: 0.85em;
    letter-spacing: 2px;
    padding: 4px 10px;
    border: 1px solid rgba(0, 212, 255, 0.5);
    border-radius: 20px;
    white-space: nowrap;
}

.tip-card .tip-text {
    color: #c8d0e7;
    font-size: 0.95em;
    line-height: 1.9;
    animation: tipFade 0.5s ease;
}

@keyframes tipFade {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
}

        /* 导航按钮区 */
        .nav {
            max-width: 700px;
            margin: 40px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .nav a {
            display: block;
            text-align: center;
            padding: 18px;
            background: rgba(233, 69, 96, 0.15);
            border: 1px solid rgba(233, 69, 96, 0.5);
            border-radius: 12px;
            color: #00d4ff;
            text-decoration: none;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .nav a:hover {
            background: #00d4ff;
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(233, 69, 96, 0.5);
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #6b7280;
            font-size: 0.85em;
        }
    </style>
</head>
<body>

    <!-- 顶部标题 -->
    <header>
        <h1>【铭刻】的存录</h1>
        <p> 欢迎你，亲爱的【命运】，来到我的见闻馆 </p>
    </header>

    <!-- 主图：把 src 换成你的图片 -->
    <div class="hero-image">
        <img src="images/itnt.png" alt="【铭刻】">
    </div>

    <!-- 随机小提示 -->
<div class="tip-card">
    <span class="tip-label">说些什么</span>
    <span class="tip-text" id="tipText">加载中……</span>
</div>

    <!-- 页面跳转导航 -->
    <nav class="nav">
        <a href="characters.html">角色介绍</a>
        <a href="races.html">种族</a>
        <a href="circulation.html">环流</a>
        <a href="timeline.html">时间线与世界线</a>
        <a href="factions.html">势力与阵营</a>
        <a href="gallery.html">珍藏的图片</a>
        <a href="about me.html">关于【铭刻】</a>
    </nav>

    <footer>
        © 2026 【铭刻】的概念 · 保留所有权利
    </footer>
    
    <footer>
        你也许想问我为什么要记录这些。
        这样吧，你就把我当做一个普通的收藏家。过去或现在亦是。
    </footer>

<script>
    // ====== 小提示内容（随便加，一行一条）======
    const tips = [
        "·亲爱的【命运】。这里的每一段存录，都在等一个愿意读完它的人。",
        "·据说边境某处下封印着的东西，至今没有人敢去确认。",
        "·环流的大陆并非无限，只是边境的探索太过困难。",
        "·帕尔玛某家店铺的情报网，比任何国家的密探都要灵通。",
        "·有些世界线，一旦踏入就再也回不来了。",
        "·【铭刻】从不记录自己，只记录别人。",
        "·埃瑟瑞尔的记忆里，藏着许多已经消失的历史。",
        "·从那场战争之后，其他埃布利尔的处境……岌岌可危。",
        "·亡灵保留着生前的记忆，却不再拥有温度。",
        "·去往你想了解的地方吧。",
        "·亲爱的【命运】，我会等你回来给我讲述你的所见所闻的。一直。",
        "·奈克莫瓦与普通的动物还是需要区分开来……毕竟奈克莫瓦算作“人类”。",
        "·部分保留了天性的赫希们可能会希望你摸摸他们的头。你喜欢毛茸茸吗?",
        "·很多奈克莫瓦都保留了原型的一些特征，比如耳朵和尾巴等等。",
        "·利那瑞们可以跳的很高，所以他们被限制参加跳高比赛……哈哈。",
        "·亲爱的【命运】，你成为概念前是什么种族?你从来没告诉过我呢。",
        "·不要给兔子投喂一些加工食品，就算是鲁纳也不行。",
        "·大部分诺克希的身高很矮，太高的诺克希可能会飞不起来。原因?我也不清楚。",
        "·我在成为概念前……可能是一位埃瑟瑞尔?我猜的。"
    ];

    // 随机选一条
    const randomTip = tips[Math.floor(Math.random() * tips.length)];
    document.getElementById('tipText').textContent = randomTip;
</script>

</body>
</html>
